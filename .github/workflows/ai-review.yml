name: AI Code Review

# Four reviewers from lambdaclass/actions (its README lists their inputs), each posting its
# review as a PR comment. They review a PR once, when it opens or leaves draft; after that a
# comment starting with /codex, /deepseek, /grok or /kimi from someone with write access asks
# that one for another. Comment-triggered runs use this file as it is on main, so the commands
# work once it is merged. PRs from forks are only reviewed on command: their pull_request runs
# get no secrets.
#
# Secrets, on the repository or the organization: OPENAI_API_KEY, DEEPSEEK_API_KEY,
# XAI_API_KEY, KIMI_API_KEY. A reviewer with no key fails on every PR, so none of these jobs
# should be a required check.
#
# The review focus is .github/prompts/ai-review.md, read from the PR's base branch so that a PR
# cannot rewrite the prompt that reviews it.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

# No concurrency group, unlike ci.yml: a cancelled review posts a "did not complete" comment, so
# cancel-in-progress would leave one on the PR for every superseded run.

# A reusable workflow gets at most the token permissions its caller job grants, so each job grants
# exactly what its reviewer declares rather than relying on the repository's default.
#
# The `if` on each job skips drafts: `opened` fires for a draft and `ready_for_review` fires again
# when it is marked ready, which would pay for two reviews, one of them of an unfinished change.
jobs:
  codex:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    uses: lambdaclass/actions/.github/workflows/ai-review-codex.yml@v1
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  deepseek:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    uses: lambdaclass/actions/.github/workflows/ai-review-deepseek.yml@v1
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  grok:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    uses: lambdaclass/actions/.github/workflows/ai-review-grok.yml@v1
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

  kimi:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    uses: lambdaclass/actions/.github/workflows/ai-review-kimi.yml@v1
    secrets:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
