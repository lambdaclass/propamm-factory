apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: propamm-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
  # The recorder's tables (feed.quotes, feed.mids, feed.vault_balances, feed.config_changes):
  # what the updater was quoting and why, queryable from a panel.
  - name: Recorder
    type: grafana-postgresql-datasource
    uid: propamm-recorder
    access: proxy
    url: postgres:5432
    user: quote_updater
    editable: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: quote_updater
      sslmode: disable
      postgresVersion: 1700
