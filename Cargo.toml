# The quote updater library and its examples. A binary built on it is a package of its own
# that depends on `quote-updater` (see examples/ and the README).
[workspace]
members = ["quote-updater"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# Release builds drop the integer overflow checks by default, and an overflow then wraps
# in silence. Everything here that does arithmetic on a number a venue or an RPC sent is
# written checked; this is for the one that is not, which becomes a panic the supervisor
# sees and restarts instead of a wrong number carried on.
overflow-checks = true
# Not panic = "abort": the library catches a pair's panic and halts that pair; aborting
# would take every pair down.
